[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recall"
version = "0.1.0"
description = "Recall — contradiction-aware long-term memory for AI agents, on Relate (relatedb.ai)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Recall contributors" }]
keywords = ["agent-memory", "relate", "graph-database", "mcp", "ai-agents", "provenance"]
dependencies = [
    "relate-db>=1.2.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=8.0", "mcp>=1.2.0"]

[project.scripts]
recall = "recall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
